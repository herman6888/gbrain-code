name: CI health

# Weekly CI health report (scripts/ci-health-report.ts): first-attempt pass
# rate of same-repository PR runs, the test files with the most failure
# annotations, shard spread with the weights miner command, new serial files
# and nightly-watch's own status, upserted as one `ci-health` issue per week.
# Reads runs, jobs and check-run annotations only (no logs, no fork runs or
# artifacts). nightly-watch watches this workflow like any scheduled one.

on:
  schedule:
    - cron: '0 10 * * 1'  # weekly, Monday 10:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report instead of writing the issue
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          # git history for the "serial files added this week" line.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2
      - name: Upsert the weekly CI health issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          bun scripts/ci-health-report.ts --repo "$GITHUB_REPOSITORY" $DRY_RUN
